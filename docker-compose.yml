services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pmk
      POSTGRES_PASSWORD: pmk
      POSTGRES_DB: pmk
    ports: ["5433:5432"]
    volumes: ["./pgdata:/var/lib/postgresql/data"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9002:9000", "9003:9001"]
    volumes: ["./miniodata:/data"]
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, minio]
    volumes: ["./backend:/app"]
  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]
    volumes: ["./frontend:/app", "/app/node_modules"]
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: http frontend:5173
    ports: ["4040:4040"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on: [frontend]
